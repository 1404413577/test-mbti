name: Deploy to GitHub Pages and Gitee

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # --- 下面是部署到 GitHub Pages 的原配置 ---
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      # --- 下面是新增的：将打包产物推送到 Gitee ---
      - name: Deploy to Gitee Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          # ⚠️ 注意：把下方的 your-username 换成你真实的 Gitee 用户名！
          external_repository: gitee.com/your-username/test-mbti
          publish_branch: gh-pages # 推送到 Gitee 的 gh-pages 分支
          publish_dir: ./dist