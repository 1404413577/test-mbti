name: Deploy to GitHub Pages and Gitee

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # --- 1. 部署到 GitHub Pages ---
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # --- 2. 终极稳妥版：使用 HTTPS Token 部署到 Gitee Pages ---
      - name: Deploy to Gitee Pages
        run: |
          cd dist
          git init
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto deploy to Gitee Pages"
          
          # 使用 Token 进行 HTTPS 强推，彻底告别 SSH 验证
          git push --force https://hailang123:${{ secrets.GITEE_TOKEN }}@gitee.com/hailang123/test-mbti.git HEAD:gh-pages