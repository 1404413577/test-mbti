name: Deploy to GitHub Pages and Gitee

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # --- 1. 部署到 GitHub Pages ---
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      # --- 2. 部署到 Gitee Pages (终极稳妥版) ---
      # 使用专业的 ssh-agent 插件来管理秘钥，避免换行符和格式引起的 128 错误
      - name: Setup SSH for Gitee
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITEE_PRIVATE_KEY }}

      - name: Deploy to Gitee Pages
        run: |
          # 将 Gitee 加入已知主机，防止 SSH 首次连接时卡在确认提示上
          ssh-keyscan -H gitee.com >> ~/.ssh/known_hosts
          
          # 进入打包好的文件目录
          cd dist
          
          # 初始化全新的 git 仓库并提交
          git init
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto deploy to Gitee Pages"
          
          # 强制推送到 Gitee
          git push --force git@gitee.com:hailang123/test-mbti.git HEAD:gh-pages