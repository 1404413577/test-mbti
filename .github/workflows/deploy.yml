name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 如果你的主分支叫 master，请把这里改成 master
  workflow_dispatch:

# 设置 GitHub Token 的权限，允许脚本将文件推送到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 确保同一时间只有一个部署任务运行
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 你可以根据你本地使用的 Node 版本修改

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite 打包后的输出目录

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4